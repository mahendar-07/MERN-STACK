<p>login works!</p>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
        </div>
        <div class="col-md-4">
           <form (ngSubmit)="checklogin()">
                <div class="form-group">
                   <label for="" class="form-label">username</label>
                   <input type="text" class="form-control" [(ngModel)]="username" placeholder="username" name="uname"> 
                </div>
                <div class="form-group">
                   <label for="" class="form-label">password</label>
                   <input type="password" class="form-control" [(ngModel)]="password"  placeholder="password" name="pwd" > 
                </div>

                <div class="form-group">
                    <button class="btn btn-primary" type="submit">Login</button>
                </div>
           </form>
        </div>
    </div>
</div>
