<p>products works!</p>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
            <button class="btn btn-dark" (click)="lowtohigh()">low price - higher price</button>
        </div>
        <div class="col-md-3">
            <button class="btn btn-dark" (click)="hightolow()">higher price - low  price</button>
        </div>
        
    </div>
    <div class="row">
        <div class="col-md-4" *ngFor="let p of products">
            <div class="card">
                <div class="card-header">
                    <img [src]="p.image" class="card-img-top" alt="">
                </div>
                <div class="card-body">
                    <h1> {{p.title}} </h1>
                    <p> {{p.description}} </p>
                    <label for="" class="badge bg-warning">price:{{p.price | currency:'INR'}} </label>
                </div>
                <div class="card-footer">
                    <button class="btn btn-primary">Buy Now</button>
                    <button class="btn btn-dark">Add Cart</button>
                </div>
            </div>

        </div>

    </div>

</div>
